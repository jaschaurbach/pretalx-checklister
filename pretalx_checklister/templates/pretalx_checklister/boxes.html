{% load i18n %}
{% load rich_text %}

{% for box in boxes %}
    <div class="alert alert-info" id="box-{{ box.block.pk }}">
        <div>
            <h4>{{ box.title }}</h4>
            {{ box.text|rich_text }}
            <label>
                <input
                    type="checkbox"
                    name="read_{{ box.block.pk }}"
                    {% if box.acknowledged %}checked{% endif %}
                    {% if preview %}disabled{% endif %}
                >
                {% translate "I have read and understood this." %}
            </label>
        </div>
    </div>
{% endfor %}
